<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ARRRGH!</title>
  </head>
  <body>
    <input
      id="gain1"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay1">GainLevel_1</label>
    <input
      id="gain2"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay2">GainLevel_2</label>
    <input
      id="gain3"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay3">Gainlevel_3</label>
    <input
      id="gain4"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay4">Gainlevel_4</label>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();

      //osc1

      const osc1 = new OscillatorNode(ctx);
      let freq = 110;
      osc1.frequency.value = freq;

      const osc2 = new OscillatorNode(ctx);
      osc2.frequency.value = freq * 1.01;
      const osc3 = new OscillatorNode(ctx);
      osc3.frequency.value = freq * 0.99;

      const gain = new GainNode(ctx);
      gain.gain.value = 0.1;

      osc1.connect(gain);
      osc2.connect(gain);
      osc3.connect(gain);
      gain.connect(ctx.destination);
      osc1.start();
      osc2.start();
      osc3.start();

      const slider1 = document.querySelector("#gain1");
      slider1.addEventListener("input", () => {
        ctx.resume();
        gain.gain.value = Number(slider1.value);
        document.querySelector("gainDisplay1").textContent = slider1.value;
      });

      //const ctx = new AudioContext();
      //ctx.suspend();

      //osc2
      const osc4 = new OscillatorNode(ctx);
      let freq2 = freq * 2;
      osc4.frequency.value = freq2;

      const osc5 = new OscillatorNode(ctx);
      osc5.frequency.value = freq2 * 1.01;
      const osc6 = new OscillatorNode(ctx);
      osc6.frequency.value = freq2 * 0.99;

      const gain2 = new GainNode(ctx);
      gain2.gain.value = 0.1;

      osc4.connect(gain2);
      osc5.connect(gain2);
      osc6.connect(gain2);
      gain2.connect(ctx.destination);
      osc4.start();
      osc5.start();
      osc6.start();

      const slider2 = document.querySelector("#gain2");
      slider2.addEventListener("input", () => {
        ctx.resume();
        gain2.gain.value = Number(slider2.value);
        document.querySelector("gainDisplay2").textContent = slider2.value;
      });

      //osc 3
      const osc7 = new OscillatorNode(ctx);
      let freq3 = freq * 3;
      osc7.frequency.value = freq3;

      const osc8 = new OscillatorNode(ctx);
      osc8.frequency.value = freq3 * 1.01;
      const osc9 = new OscillatorNode(ctx);
      osc9.frequency.value = freq3 * 0.99;

      const gain3 = new GainNode(ctx);
      gain3.gain.value = 0.1;

      osc7.connect(gain3);
      osc8.connect(gain3);
      osc9.connect(gain3);
      gain3.connect(ctx.destination);
      osc7.start();
      osc8.start();
      osc9.start();

      const slider3 = document.querySelector("#gain3");
      slider3.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(slider3.value);
        document.querySelector("gainDisplay3").textContent = slider3.value;
      });

      //osc 4
      const osc10 = new OscillatorNode(ctx);
      let freq4 = freq * 4;
      osc10.frequency.value = freq4;

      const osc11 = new OscillatorNode(ctx);
      osc11.frequency.value = freq4 * 1.01;
      const osc12 = new OscillatorNode(ctx);
      osc12.frequency.value = freq4 * 0.99;

      const gain4 = new GainNode(ctx);
      gain4.gain.value = 0.1;

      osc10.connect(gain4);
      osc11.connect(gain4);
      osc12.connect(gain4);
      gain4.connect(ctx.destination);
      osc10.start();
      osc11.start();
      osc12.start();

      const slider4 = document.querySelector("#gain4");
      slider4.addEventListener("input", () => {
        ctx.resume();
        gain4.gain.value = Number(slider4.value);
        document.querySelector("gainDisplay4").textContenet = slider4.value;
      });
    </script>
  </body>
</html>
