<!doctype html>
<html lang="en">
  <head>
    <meta chartset="UTF-8" />
    <title>SliderPitch</title>
  </head>
  <body>
    <input id="freq" type="range" min="100" max="1000" value="440" /><label
      id="freqDisplay"
      >Pitch</label
    >
    <input
      id="gain"
      type="range"
      min="0"
      max="0.25"
      step="0.01"
      value="0.1"
    /><label id="gainDisplay">Gain</label>

    <input id="freq2" type="range" min="100" max="1000" value="440" /><label
      id="freq2Display"
      >Pitch2</label
    >
    <input
      id="gain2"
      type="range"
      min="0"
      max="0.25"
      step="0.01"
      value="0.1"
    /><label id="gain2Display">Gain2</label>

    <input id="freq3" type="range" min="100" max="1000" value="440" /><label
      id="freq3Display"
      >Pitch3</label
    >
    <input
      id="gain3"
      type="range"
      min="0"
      max="0.25"
      step="0.01"
      value="0.1"
    /><label id="gain3Display">Gain3</label>

    <input id="freq4" type="range" min="100" max="1000" value="440" /><label
      id="freq4Display"
      >Pitch4</label
    >
    <input
      id="gain4"
      type="range"
      min="0"
      max="0.25"
      step="0.01"
      value="0.1"
    /><label id="gain4Display">Gain4</label>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();

      //1
      const osc1 = new OscillatorNode(ctx);
      let freq = 110;
      osc1.frequency.value = freq;

      const osc2 = new OscillatorNode(ctx);
      osc2.frequency.value = freq * 1.01;
      const osc3 = new OscillatorNode(ctx);
      osc3.frequency.value = freq * 0.99;

      const gain = new GainNode(ctx);
      gain.gain.value = 0.01;

      osc1.connect(gain);
      osc2.connect(gain);
      osc3.connect(gain);
      gain.connect(ctx.destination);
      osc1.start();
      osc2.start();
      osc3.start();

      const slider = document.querySelector("#freq");
      slider.addEventListener("input", () => {
        ctx.resume();
        osc1.frequency.value = Number(slider.value);
        osc2.frequency.value = Number(slider.value);
        osc3.frequency.value = Number(slider.value);
        document.querySelector("#freqDisplay").textContent = slider.value;
      });

      const slider2 = document.querySelector("#gain");
      slider2.addEventListener("input", () => {
        ctx.resume();
        gain.gain.value = Number(slider2.value);
        document.querySelector("gainDisplay").textContent = slider2.value;
      });

      //2
      const osc4 = new OscillatorNode(ctx);
      let freq2 = 110;
      osc4.frequency.value = freq2;

      const osc5 = new OscillatorNode(ctx);
      osc5.frequency.value = freq2 * 1.04;
      const osc6 = new OscillatorNode(ctx);
      osc6.frequency.value = freq2 * 0.96;

      const gain2 = new GainNode(ctx);
      gain2.gain.value = 0.01;

      osc4.connect(gain2);
      osc5.connect(gain2);
      osc6.connect(gain2);
      gain2.connect(ctx.destination);
      osc4.start();
      osc5.start();
      osc6.start();

      const slider3 = document.querySelector("#freq2");
      slider3.addEventListener("input", () => {
        ctx.resume();
        osc4.frequency.value = Number(slider3.value);
        osc5.frequency.value = Number(slider3.value);
        osc6.frequency.value = Number(slider3.value);
        document.querySelector("#freq2Display").textContent = slider3.value;
      });

      const slider4 = document.querySelector("#gain2");
      slider4.addEventListener("input", () => {
        ctx.resume();
        gain2.gain.value = Number(slider4.value);
        document.querySelector("gain2Display").textContent = slider4.value;
      });

      //3
      const osc7 = new OscillatorNode(ctx);
      let freq3 = 110;
      osc7.frequency.value = freq3;

      const osc8 = new OscillatorNode(ctx);
      osc8.frequency.value = freq3 * 1.01;
      const osc9 = new OscillatorNode(ctx);
      osc9.frequency.value = freq3 * 0.99;

      const gain3 = new GainNode(ctx);
      gain3.gain.value = 0.01;

      osc7.connect(gain3);
      osc8.connect(gain3);
      osc9.connect(gain3);
      gain3.connect(ctx.destination);
      osc7.start();
      osc8.start();
      osc9.start();

      const slider5 = document.querySelector("#freq3");
      slider5.addEventListener("input", () => {
        ctx.resume();
        osc7.frequency.value = Number(slider5.value);
        osc8.frequency.value = Number(slider5.value);
        osc9.frequency.value = Number(slider5.value);
        document.querySelector("#freq3Display").textContent = slider5.value;
      });

      const slider6 = document.querySelector("#gain3");
      slider6.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(slider6.value);
        document.querySelector("gain3Display").textContent = slider6.value;
      });

      //4
      const osc10 = new OscillatorNode(ctx);
      let freq4 = 110;
      osc10.frequency.value = freq4;

      const osc11 = new OscillatorNode(ctx);
      osc11.frequency.value = freq4 * 1.01;
      const osc12 = new OscillatorNode(ctx);
      osc12.frequency.value = freq4 * 0.99;

      const gain4 = new GainNode(ctx);
      gain4.gain.value = 0.01;

      osc10.connect(gain4);
      osc11.connect(gain4);
      osc12.connect(gain4);
      gain4.connect(ctx.destination);
      osc10.start();
      osc11.start();
      osc12.start();

      const slider7 = document.querySelector("#freq4");
      slider7.addEventListener("input", () => {
        ctx.resume();
        osc10.frequency.value = Number(slider7.value);
        osc11.frequency.value = Number(slider7.value);
        osc12.frequency.value = Number(slider7.value);
        document.querySelector("#freq4Display").textContent = slider7.value;
      });

      const slider8 = document.querySelector("#gain4");
      slider8.addEventListener("input", () => {
        ctx.resume();
        gain4.gain.value = Number(slider8.value);
        document.querySelector("gain4Display").textContent = slider8.value;
      });
    </script>
  </body>
</html>
